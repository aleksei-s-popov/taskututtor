name = "taskututtor"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# One deployment, one address: `npm run build:web` puts the landing page at / and the
# subscription app at /app/, and this Worker serves both next to its API.
[assets]
directory = "./web"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
# Models (OpenRouter ids), chosen by measurement: see docs/model-evaluation.md.
# The glossary model writes each chapter's word list after the story is saved. The story model writes chapters; the lookup model answers
# single-word questions; the image model paints illustrations.
STORY_MODEL = "openai/gpt-6.1-terra"
GLOSSARY_MODEL = "openai/gpt-6-luna"
LOOKUP_MODEL = "anthropic/claude-haiku-5.5"
IMAGE_MODEL = "microsoft/mai-image-2.7-flash"
# New chapters one reader may request per day (UTC).
DAILY_CHAPTER_LIMIT = "5"
# Comma-separated web origins allowed to call this API, e.g. "https://app.example.com".
ALLOWED_ORIGINS = "*"
# Weekly database exports to keep (12 = about three months).
BACKUP_KEEP = "12"

# Secrets — set with `wrangler secret put NAME`, never in this file:
#   OPENROUTER_API_KEY   key that pays for generation
#   CLERK_JWT_KEY        Clerk "JWKS public key" (PEM), used to verify sign-in tokens

[[d1_databases]]
binding = "DB"
database_name = "taskututtor"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "taskututtor-images"

# Weekly database export (Mondays 03:17 UTC) — see src/backup.ts.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "taskututtor-backups"

[triggers]
crons = ["17 3 * * 1"]

[[queues.producers]]
binding = "JOBS"
queue = "taskututtor-jobs"

[[queues.consumers]]
queue = "taskututtor-jobs"
max_batch_size = 1
max_retries = 1
